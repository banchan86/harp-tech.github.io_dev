<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" role="img" aria-label="A Write message to the StartSound register at address 32 carrying a sound index, and the device reply with the same register and value plus a timestamp" font-size="12" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif">
<rect x="40" y="20" width="280" height="124" rx="10" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.6"/>
<path d="M40,50 V30 Q40,20 50,20 H310 Q320,20 320,30 V50 Z" fill="#3b82f6"/>
<text x="180.0" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Write</text>
<text x="56" y="69" font-size="12" opacity="0.7" fill="#212529">Register</text>
<text x="304" y="69" text-anchor="end" font-size="12" font-weight="700" fill="#212529">StartSound</text>
<line x1="52" y1="78" x2="308" y2="78" stroke="#212529" stroke-opacity="0.15"/>
<text x="56" y="97" font-size="12" opacity="0.7" fill="#212529">Address</text>
<text x="304" y="97" text-anchor="end" font-size="12" font-weight="700" fill="#212529">32</text>
<line x1="52" y1="106" x2="308" y2="106" stroke="#212529" stroke-opacity="0.15"/>
<text x="56" y="125" font-size="12" opacity="0.7" fill="#212529">Payload</text>
<text x="304" y="125" text-anchor="end" font-size="12" font-weight="700" fill="#212529">Sound index = 3</text>
<rect x="440" y="20" width="280" height="152" rx="10" fill="#f0883e" fill-opacity="0.1" stroke="#f0883e" stroke-width="1.6"/>
<path d="M440,50 V30 Q440,20 450,20 H710 Q720,20 720,30 V50 Z" fill="#f0883e"/>
<text x="580.0" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Reply</text>
<text x="456" y="69" font-size="12" opacity="0.7" fill="#212529">Register</text>
<text x="704" y="69" text-anchor="end" font-size="12" font-weight="700" fill="#212529">StartSound</text>
<line x1="452" y1="78" x2="708" y2="78" stroke="#212529" stroke-opacity="0.15"/>
<text x="456" y="97" font-size="12" opacity="0.7" fill="#212529">Address</text>
<text x="704" y="97" text-anchor="end" font-size="12" font-weight="700" fill="#212529">32</text>
<line x1="452" y1="106" x2="708" y2="106" stroke="#212529" stroke-opacity="0.15"/>
<text x="456" y="125" font-size="12" opacity="0.7" fill="#212529">Payload</text>
<text x="704" y="125" text-anchor="end" font-size="12" font-weight="700" fill="#212529">Sound index = 3</text>
<line x1="452" y1="134" x2="708" y2="134" stroke="#212529" stroke-opacity="0.15"/>
<text x="456" y="153" font-size="12" opacity="0.7" fill="#212529">Timestamp</text>
<text x="704" y="153" text-anchor="end" font-size="12" font-weight="700" fill="#212529">128.3 s</text>
<text x="180" y="162" text-anchor="middle" font-size="11" opacity="0.7" fill="#212529">from the controller</text>
<text x="580" y="190" text-anchor="middle" font-size="11" opacity="0.7" fill="#212529">from the device</text>
<polygon points="340,69 396,69 396,63 414,76 396,89 396,83 340,83" fill="#212529" fill-opacity="0.35"/>
</svg>
